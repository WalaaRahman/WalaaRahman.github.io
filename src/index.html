<!doctype html>
<html lang="en" data-palette="burgundy">
<head>
  <meta charset="utf-8">
  <title>Walaa El Gohary | Frontend Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Walaa El Gohary — Frontend Developer specializing in Angular, TypeScript and responsive, accessible interfaces.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#5B1722">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Apply saved theme before first paint to avoid a light/dark flash. -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var palette = localStorage.getItem('portfolio-palette');
        var mode = localStorage.getItem('portfolio-mode');
        if (palette) root.setAttribute('data-palette', palette);
        if (mode === 'dark' || (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
